  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'scentvault-default';
    let db = null;
    let auth = null;
    let isCloudReady = false;

    // ブラウザIndexedDB永続化
    const DB_NAME = 'ScentVaultPermanentDB';
    const STORE_NAME = 'perfumes';

    const openIDB = () => {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    };

    // クラウドストレージ初期化
    if (typeof __firebase_config !== 'undefined') {
      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        isCloudReady = true;
      } catch (e) {
        console.warn('[Storage] Cloud fallback to local:', e);
      }
    }

    window.AppStorage = {
      isCloud: () => isCloudReady,

      subscribe: (onDataReceived) => {
        let isHandled = false;
        let unsubscribeCloud = () => {};

        // IndexedDBから高速復元
        openIDB().then(idb => {
          if (!idb) return;
          const tx = idb.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            if (Array.isArray(req.result) && req.result.length > 0 && !isHandled) {
              onDataReceived(req.result, 'browser');
            }
          };
        });

        // クラウド同期
        if (isCloudReady && db) {
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'perfumes');
          unsubscribeCloud = onSnapshot(colRef, (snapshot) => {
            if (!snapshot.empty) {
              isHandled = true;
              const list = [];
              snapshot.forEach((docSnap) => {
                list.push(docSnap.data());
              });
              onDataReceived(list, 'cloud');

              openIDB().then(idb => {
                if (!idb) return;
                const tx = idb.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.clear();
                list.forEach(item => store.put(item));
              });
            }
          }, (err) => {
            console.warn('[Storage] Snapshot error:', err);
          });
        }

        return () => {
          unsubscribeCloud();
        };
      },

      saveItem: async (item) => {
        try {
          const idb = await openIDB();
          if (idb) {
            const tx = idb.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(item);
          }
        } catch (err) {
          console.warn('IDB item save error', err);
        }

        if (isCloudReady && db && auth?.currentUser) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'perfumes', item.id);
            await setDoc(docRef, item, { merge: true });
          } catch (e) {
            console.warn('Cloud save error:', e);
          }
        }
      },

      deleteItem: async (id) => {
        try {
          const idb = await openIDB();
          if (idb) {
            const tx = idb.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
          }
        } catch (e) {
          console.warn('IDB delete error', err);
        }

        if (isCloudReady && db && auth?.currentUser) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'perfumes', id);
            await deleteDoc(docRef);
          } catch (e) {
            console.warn('Cloud delete error:', e);
          }
        }
      }
    };

    window.dispatchEvent(new CustomEvent('storage-ready'));
  </script>

    const compressImage = (file, maxWidth = 750, quality = 0.72) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let { width, height } = img;
            if (width > maxWidth || height > maxWidth) {
              if (width > height) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        };
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
      });
    };

    function Scent3DViewer({ metrics, perfumeName }) {
      const canvasRef = useRef(null);
      const [rotation, setRotation] = useState({ x: 0.35, y: -0.55 });
      const [isDragging, setIsDragging] = useState(false);
      const [autoRotate, setAutoRotate] = useState(true);
      const lastPos = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;

        const render = () => {
          const width = canvas.clientWidth;
          const height = canvas.clientHeight;
          if (canvas.width !== width * 2 || canvas.height !== height * 2) {
            canvas.width = width * 2;
            canvas.height = height * 2;
          }

          ctx.save();
          ctx.scale(2, 2);
          ctx.clearRect(0, 0, width, height);

          const centerX = width / 2;
          const centerY = height / 2;
          const cubeSize = 95;
          const fov = 380;

          const project = (x, y, z) => {
            let x1 = x * Math.cos(rotation.y) + z * Math.sin(rotation.y);
            let y1 = y;
            let z1 = -x * Math.sin(rotation.y) + z * Math.cos(rotation.y);

            let x2 = x1;
            let y2 = y1 * Math.cos(rotation.x) - z1 * Math.sin(rotation.x);
            let z2 = y1 * Math.sin(rotation.x) + z1 * Math.cos(rotation.x);

            const scale = fov / (fov + z2 + 350);
            return { x: centerX + x2 * scale, y: centerY + y2 * scale, z: z2 };
          };

          const vertices = [
            [-cubeSize, -cubeSize, -cubeSize], [cubeSize, -cubeSize, -cubeSize],
            [cubeSize, cubeSize, -cubeSize], [-cubeSize, cubeSize, -cubeSize],
            [-cubeSize, -cubeSize, cubeSize], [cubeSize, -cubeSize, cubeSize],
            [cubeSize, cubeSize, cubeSize], [-cubeSize, cubeSize, cubeSize],
          ].map(v => project(v[0], v[1], v[2]));

          const edges = [
            [0,1], [1,2], [2,3], [3,0], [4,5], [5,6], [6,7], [7,4],
            [0,4], [1,5], [2,6], [3,7]
          ];

          ctx.strokeStyle = '#e7e5e4';
          ctx.lineWidth = 1;
          edges.forEach(([start, end]) => {
            ctx.beginPath();
            ctx.moveTo(vertices[start].x, vertices[start].y);
            ctx.lineTo(vertices[end].x, vertices[end].y);
            ctx.stroke();
          });

          // 軸線
          const axisLen = cubeSize * 1.3;
          ctx.beginPath(); ctx.strokeStyle = '#a8a29e'; ctx.setLineDash([2, 3]);
          ctx.moveTo(project(-axisLen, 0, 0).x, project(-axisLen, 0, 0).y);
          ctx.lineTo(project(axisLen, 0, 0).x, project(axisLen, 0, 0).y); ctx.stroke();

          ctx.beginPath(); ctx.strokeStyle = '#d97706';
          ctx.moveTo(project(0, axisLen, 0).x, project(0, axisLen, 0).y);
          ctx.lineTo(project(0, -axisLen, 0).x, project(0, -axisLen, 0).y); ctx.stroke();

          ctx.beginPath(); ctx.strokeStyle = '#4f46e5';
          ctx.moveTo(project(0, 0, -axisLen).x, project(0, 0, -axisLen).y);
          ctx.lineTo(project(0, 0, axisLen).x, project(0, 0, axisLen).y); ctx.stroke();
          ctx.setLineDash([]);

          // 座標点
          const normX = (((metrics.heaviness || 3) - 3) / 2) * cubeSize;
          const normY = -(((metrics.sweetness || 3) - 3) / 2) * cubeSize;
          const normZ = (((metrics.uniqueness || 3) - 3) / 2) * cubeSize;
          const pPos = project(normX, normY, normZ);

          const glow = ctx.createRadialGradient(pPos.x, pPos.y, 1, pPos.x, pPos.y, 16);
          glow.addColorStop(0, 'rgba(217, 119, 6, 1)');
          glow.addColorStop(0.5, 'rgba(217, 119, 6, 0.4)');
          glow.addColorStop(1, 'rgba(217, 119, 6, 0)');

          ctx.beginPath(); ctx.arc(pPos.x, pPos.y, 16, 0, Math.PI * 2);
          ctx.fillStyle = glow; ctx.fill();

          ctx.beginPath(); ctx.arc(pPos.x, pPos.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();

          if (perfumeName) {
            ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#1c1917';
            ctx.fillText(perfumeName, pPos.x + 8, pPos.y - 8);
          }

          ctx.restore();

          if (autoRotate && !isDragging) {
            setRotation(prev => ({ x: prev.x, y: prev.y + 0.005 }));
          }
        };

        frameId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(frameId);
      }, [rotation, metrics, isDragging, autoRotate, perfumeName]);

      const handlePointerDown = (e) => {
        setIsDragging(true);
        lastPos.current = { x: e.clientX, y: e.clientY };
        e.target.setPointerCapture(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastPos.current.x;
        const dy = e.clientY - lastPos.current.y;
        setRotation(prev => ({
          x: Math.max(-1.4, Math.min(1.4, prev.x + dy * 0.01)),
          y: prev.y + dx * 0.01
        }));
        lastPos.current = { x: e.clientX, y: e.clientY };
      };

      const handlePointerUp = (e) => {
        setIsDragging(false);
        try { e.target.releasePointerCapture(e.pointerId); } catch (_) {}
      };

      return (
        <div className="relative w-full max-w-[340px] aspect-square bg-white border border-stone-200 select-none shadow-xs">
          <canvas
            ref={canvasRef}
            className="w-full h-full cursor-grab active:cursor-grabbing touch-none"
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerUp}
          />
          <div className="absolute top-2 right-2 flex items-center gap-1 bg-white/90 border border-stone-200 p-1">
            <button
              onClick={() => setAutoRotate(!autoRotate)}
              className={`p-1 text-xs ${autoRotate ? 'text-amber-700 font-bold' : 'text-stone-500 hover:text-stone-800'}`}
              title={autoRotate ? '自動回転を停止' : '自動回転を開始'}
            >
              {autoRotate ? <IconPause className="w-3.5 h-3.5" /> : <IconPlay className="w-3.5 h-3.5" />}
            </button>
            <button
              onClick={() => setRotation({ x: 0.35, y: -0.55 })}
              className="p-1 text-stone-600 hover:text-stone-900"
              title="視点をリセット"
            >
              <IconRotateCcw className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
      );
    }

                    <div className="flex flex-wrap gap-1.5">
                      {(formData.pyramid?.top || []).map((note, i) => (
                        <span key={i} className="inline-flex items-center gap-1 px-3 py-1 bg-white text-xs border border-amber-200">
                          {note}
                          <button type="button" onClick={() => removeNote('top', i)} className="text-stone-400 hover:text-rose-600"><IconX className="w-3 h-3" /></button>
                        </span>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={tempTop}
                        onChange={(e) => setTempTop(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            addNote('top', tempTop, setTempTop);
                          }
                        }}
                        placeholder="ノート名を入力してEnterで追加..."
                        className="flex-1 px-3 py-1 bg-white border border-stone-300 text-xs focus:outline-none focus:border-stone-900"
                      />
                      <button type="button" onClick={() => addNote('top', tempTop, setTempTop)} className="px-3 py-1 bg-stone-900 text-white text-xs">追加</button>
                    </div>
                  </div>

                  {/* Middle */}
                  <div className="p-3.5 bg-stone-50 border border-stone-200 space-y-2">
                    <span className="text-xs font-mono font-bold text-stone-900">2. Heart & Middle Notes / ミドルノート（主役）</span>
                    <div className="flex flex-wrap gap-1.5">
                      {(formData.pyramid?.middle || []).map((note, i) => (
                        <span key={i} className="inline-flex items-center gap-1 px-3 py-1 bg-white text-xs border border-stone-300">
                          {note}
                          <button type="button" onClick={() => removeNote('middle', i)} className="text-stone-400 hover:text-rose-600"><IconX className="w-3 h-3" /></button>
                        </span>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={tempMid}
                        onChange={(e) => setTempMid(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            addNote('middle', tempMid, setTempMid);
                          }
                        }}
                        placeholder="ノート名を入力してEnterで追加..."
                        className="flex-1 px-3 py-1 bg-white border border-stone-300 text-xs focus:outline-none focus:border-stone-900"
                      />
                      <button type="button" onClick={() => addNote('middle', tempMid, setTempMid)} className="px-3 py-1 bg-stone-900 text-white text-xs">追加</button>
                    </div>
                  </div>

                  {/* Base */}
                  <div className="p-3.5 bg-stone-100 border-2 border-stone-900 space-y-2">
                    <span className="text-xs font-mono font-bold text-stone-900">3. Base & Last Notes / ラストノート（余韻）</span>
                    <div className="flex flex-wrap gap-1.5">
                      {(formData.pyramid?.base || []).map((note, i) => (
                        <span key={i} className="inline-flex items-center gap-1 px-3 py-1 bg-white text-xs border border-stone-300">
                          {note}
                          <button type="button" onClick={() => removeNote('base', i)} className="text-stone-400 hover:text-rose-600"><IconX className="w-3 h-3" /></button>
                        </span>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={tempBase}
                        onChange={(e) => setTempBase(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            addNote('base', tempBase, setTempBase);
                          }
                        }}
                        placeholder="ノート名を入力してEnterで追加..."
                        className="flex-1 px-3 py-1 bg-white border border-stone-300 text-xs focus:outline-none focus:border-stone-900"
                      />
                      <button type="button" onClick={() => addNote('base', tempBase, setTempBase)} className="px-3 py-1 bg-stone-900 text-white text-xs">追加</button>
                    </div>
                  </div>

                  {/* 主要アコード */}
                  <div className="p-3.5 bg-white border border-stone-200 space-y-2">
                    <span className="text-xs font-mono font-bold text-stone-600 uppercase">主要アコード (Accords)</span>
                    <div className="flex flex-wrap gap-1.5">
                      {(formData.accords || []).map((a, i) => (
                        <span key={i} className="inline-flex items-center gap-1 px-2.5 py-1 bg-stone-100 text-stone-800 text-xs border border-stone-200">
                          #{a}
                          <button type="button" onClick={() => removeAccord(i)} className="text-stone-400 hover:text-rose-600"><IconX className="w-3 h-3" /></button>
                        </span>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={tempAccord}
                        onChange={(e) => setTempAccord(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            addAccord();
                          }
                        }}
                        placeholder="例: スモーキー, パウダリー (Enterで追加)"
                        className="flex-1 px-3 py-1 bg-stone-50 border border-stone-300 text-xs focus:outline-none focus:border-stone-900"
                      />
                      <button type="button" onClick={addAccord} className="px-3 py-1 bg-stone-900 text-white text-xs">追加</button>
                    </div>
                  </div>
                </div>
              )}

              {}
              {formTab === 'metrics' && (
                <div className="space-y-4">
                  <div className="p-3.5 bg-stone-50 border border-stone-200 space-y-1">
                    <div className="flex justify-between text-xs font-mono">
                      <span>X軸: 重厚感</span>
                      <span>{formData.metrics.heaviness} / 5.0</span>
                    </div>
                    <input
                      type="range" min="1" max="5" step="0.1"
                      value={formData.metrics.heaviness}
                      onChange={(e) => setFormData({ ...formData, metrics: { ...formData.metrics, heaviness: parseFloat(e.target.value) } })}
                      className="w-full accent-stone-900"
                    />
                  </div>

                  <div className="p-3.5 bg-stone-50 border border-stone-200 space-y-1">
                    <div className="flex justify-between text-xs font-mono">
                      <span>Y軸: 爽快 ↔ 甘口</span>
                      <span>{formData.metrics.sweetness} / 5.0</span>
                    </div>
                    <input
                      type="range" min="1" max="5" step="0.1"
                      value={formData.metrics.sweetness}
                      onChange={(e) => setFormData({ ...formData, metrics: { ...formData.metrics, sweetness: parseFloat(e.target.value) } })}
                      className="w-full accent-amber-600"
                    />
                  </div>

                  <div className="p-3.5 bg-stone-50 border border-stone-200 space-y-1">
                    <div className="flex justify-between text-xs font-mono">
                      <span>Z軸: 万人 ↔ 個性</span>
                      <span>{formData.metrics.uniqueness} / 5.0</span>
                    </div>
                    <input
                      type="range" min="1" max="5" step="0.1"
                      value={formData.metrics.uniqueness}
                      onChange={(e) => setFormData({ ...formData, metrics: { ...formData.metrics, uniqueness: parseFloat(e.target.value) } })}
                      className="w-full accent-indigo-600"
                    />
                  </div>

                  <div className="space-y-1.5 pt-2">
                    <label className="block text-xs font-mono uppercase text-stone-500">適した季節</label>
                    <div className="flex gap-2">
                      {SEASONS.map(s => {
                        const active = (formData.seasons || []).includes(s.id);
                        return (
                          <button
                            key={s.id}
                            type="button"
                            onClick={() => toggleSeason(s.id)}
                            className={`flex-1 py-2 border text-xs font-medium ${active ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-500 border-stone-300'}`}
                          >
                            {s.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {}
              {formTab === 'notes' && (
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono uppercase text-stone-500 mb-1">お気に入り度 (★ {formData.rating})</label>
                    <input
                      type="range" min="1" max="5" step="0.5"
                      value={formData.rating}
                      onChange={(e) => setFormData({ ...formData, rating: parseFloat(e.target.value) })}
                      className="w-full accent-stone-900"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-mono uppercase text-stone-500 mb-1">ボトル全容量 (ml)</label>
                      <input
                        type="number"
                        value={formData.bottleSize || 50}
                        onChange={(e) => setFormData({ ...formData, bottleSize: parseInt(e.target.value) || 0 })}
                        className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-mono uppercase text-stone-500 mb-1">現在の残量 (ml)</label>
                      <input
                        type="number"
                        value={formData.remainingAmount || 0}
                        onChange={(e) => setFormData({ ...formData, remainingAmount: parseInt(e.target.value) || 0 })}
                        className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-mono uppercase text-stone-500 mb-1">参考価格 (円)</label>
                    <input
                      type="text"
                      value={formData.price || ''}
                      onChange={(e) => setFormData({ ...formData, price: e.target.value })}
                      placeholder="例: 28,000"
                      className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono uppercase text-stone-500 mb-1">公式説明 / ストーリー</label>
                    <textarea
                      rows="2"
                      value={formData.description || ''}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      placeholder="ストーリー..."
                      className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono uppercase text-stone-500 mb-1">個人的なメモ</label>
                    <textarea
                      rows="2"
                      value={formData.memo || ''}
                      onChange={(e) => setFormData({ ...formData, memo: e.target.value })}
                      placeholder="香りの印象や使用シーン..."
                      className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 text-xs"
                    />
                  </div>
                </div>
              )}

              <div className="pt-4 border-t border-stone-200 flex justify-end gap-3">
                <button type="button" onClick={onClose} className="px-4 py-2 border border-stone-300 text-xs">キャンセル</button>
                <button type="submit" className="px-5 py-2 bg-stone-900 text-white text-xs font-bold shadow-sm">保存する</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
